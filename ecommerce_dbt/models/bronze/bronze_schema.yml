version: 2

models:
  # ============================================================
  # BRONZE CUSTOMERS
  # Grain: One row per customer_id
  # ============================================================
  - name: bronze_customers
    description: >
      Standardized customer records from the RAW source.
      One row per customer, preserving source identifiers
      and ingestion metadata.

    columns:
      - name: customer_id
        description: "Unique customer identifier."
        data_tests:
          - not_null
          - unique

      - name: customer_name
        description: "Customer name with whitespace trimmed."
        data_tests:
          - not_null

      - name: email
        description: "Trimmed and lowercase customer email."
        data_tests:
          - not_null
          - unique

      - name: phone
        description: "Customer phone number; blank values become NULL."

      - name: gender
        description: "Customer gender with standardized capitalization."

      - name: date_of_birth
        description: "Customer date of birth."

      - name: city
        description: "Customer city with standardized capitalization."

      - name: state
        description: "Customer state with standardized capitalization."

      - name: country
        description: "Customer country with standardized capitalization."

      - name: postal_code
        description: "Trimmed customer postal code."

      - name: customer_segment
        description: "Customer segment with standardized capitalization."

      - name: customer_status
        description: "Customer status with standardized capitalization."

      - name: signup_date
        description: "Customer signup date."
        data_tests:
          - not_null

      - name: updated_at
        description: "Source record modification timestamp."

      - name: ingested_at
        description: "Timestamp when the record entered the RAW layer."
        data_tests:
          - not_null

      - name: loaded_at
        description: >
          Query-time timestamp generated by the Bronze view.
          This is not a persistent model-build timestamp.
        data_tests:
          - not_null

  # ============================================================
  # BRONZE PRODUCTS
  # Grain: One row per product_id
  # ============================================================
  - name: bronze_products
    description: >
      Standardized product catalog records, including pricing,
      inventory, supplier identifiers, and source metadata.

    columns:
      - name: product_id
        description: "Unique product identifier."
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: "Trimmed product name."
        data_tests:
          - not_null

      - name: category
        description: "Product category with standardized capitalization."
        data_tests:
          - not_null

      - name: subcategory
        description: "Product subcategory."

      - name: brand
        description: "Product brand."

      - name: supplier_id
        description: "Supplier identifier from the source."

      - name: cost_price
        description: "Recorded product cost price."

      - name: selling_price
        description: "Recorded product selling price."

      - name: stock_quantity
        description: "Recorded available inventory quantity."

      - name: reorder_level
        description: "Recorded stock reorder threshold."

      - name: product_status
        description: "Product status with standardized capitalization."

      - name: launch_date
        description: "Product launch date."

      - name: updated_at
        description: "Source record modification timestamp."

      - name: ingested_at
        description: "Timestamp when the record entered the RAW layer."
        data_tests:
          - not_null

      - name: loaded_at
        description: "Query-time timestamp generated by the Bronze view."
        data_tests:
          - not_null

  # ============================================================
  # BRONZE ORDERS
  # Grain: One row per order_id
  # ============================================================
  - name: bronze_orders
    description: >
      Standardized order records, including customer references,
      status, order amounts, currency, and source metadata.

    columns:
      - name: order_id
        description: "Unique order identifier."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer who placed the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('bronze_customers')
                field: customer_id

      - name: order_date
        description: "Order creation timestamp."
        data_tests:
          - not_null

      - name: order_status
        description: "Order status with standardized capitalization."
        data_tests:
          - not_null

      - name: payment_status
        description: "Payment status recorded on the order."

      - name: shipping_method
        description: "Shipping method with standardized capitalization."

      - name: shipping_cost
        description: "Shipping cost; NULL values are converted to zero."

      - name: discount_amount
        description: "Order discount; NULL values are converted to zero."

      - name: tax_amount
        description: "Order tax; NULL values are converted to zero."

      - name: total_amount
        description: "Order total recorded by the source."

      - name: sales_channel
        description: "Sales channel with standardized capitalization."

      - name: currency
        description: "Currency code standardized to uppercase."

      - name: updated_at
        description: "Source record modification timestamp."

      - name: ingested_at
        description: "Timestamp when the record entered the RAW layer."
        data_tests:
          - not_null

      - name: loaded_at
        description: "Query-time timestamp generated by the Bronze view."
        data_tests:
          - not_null

  # ============================================================
  # BRONZE ORDER ITEMS
  # Grain: One row per order_item_id
  # ============================================================
  - name: bronze_order_items
    description: >
      Standardized order line items, retaining historical prices,
      discounts, taxes, recorded line totals, and return quantities.

    columns:
      - name: order_item_id
        description: "Unique order line-item identifier."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Order containing this item."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('bronze_orders')
                field: order_id

      - name: product_id
        description: "Product associated with this item."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('bronze_products')
                field: product_id

      - name: quantity
        description: "Quantity ordered."
        data_tests:
          - not_null

      - name: unit_price
        description: "Historical unit price at purchase."
        data_tests:
          - not_null

      - name: discount_amount
        description: "Line discount; NULL values are converted to zero."

      - name: tax_amount
        description: "Line tax; NULL values are converted to zero."

      - name: line_total
        description: "Line total recorded by the source."

      - name: returned_quantity
        description: "Recorded return quantity; NULL values become zero."

      - name: updated_at
        description: "Source record modification timestamp."

      - name: ingested_at
        description: "Timestamp when the record entered the RAW layer."
        data_tests:
          - not_null

      - name: loaded_at
        description: "Query-time timestamp generated by the Bronze view."
        data_tests:
          - not_null

  # ============================================================
  # BRONZE PAYMENTS
  # Grain: One row per payment_id
  # ============================================================
  - name: bronze_payments
    description: >
      Standardized payment transactions. An order can have
      multiple payment records.

    columns:
      - name: payment_id
        description: "Unique payment identifier."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Order associated with the payment."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('bronze_orders')
                field: order_id

      - name: payment_date
        description: "Payment transaction timestamp."
        data_tests:
          - not_null

      - name: payment_method
        description: "Payment method with standardized capitalization."
        data_tests:
          - not_null

      - name: payment_status
        description: "Payment status with standardized capitalization."
        data_tests:
          - not_null

      - name: amount
        description: "Payment amount recorded by the source."
        data_tests:
          - not_null

      - name: transaction_reference
        description: "Transaction reference; blank values become NULL."

      - name: updated_at
        description: "Source record modification timestamp."

      - name: ingested_at
        description: "Timestamp when the record entered the RAW layer."
        data_tests:
          - not_null

      - name: loaded_at
        description: "Query-time timestamp generated by the Bronze view."
        data_tests:
          - not_null

  # ============================================================
  # BRONZE SHIPMENTS
  # Grain: One row per shipment_id
  # ============================================================
  - name: bronze_shipments
    description: >
      Standardized shipment records with dispatch, delivery,
      location, and source metadata.

    columns:
      - name: shipment_id
        description: "Unique shipment identifier."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Order associated with the shipment."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('bronze_orders')
                field: order_id

      - name: shipping_method
        description: "Shipping method with standardized capitalization."
        data_tests:
          - not_null

      - name: shipment_status
        description: "Shipment status with standardized capitalization."
        data_tests:
          - not_null

      - name: shipped_at
        description: "Shipment dispatch timestamp."

      - name: delivered_at
        description: "Shipment delivery timestamp."

      - name: delivery_city
        description: "Delivery city with standardized capitalization."

      - name: delivery_state
        description: "Delivery state with standardized capitalization."

      - name: updated_at
        description: "Source record modification timestamp."

      - name: ingested_at
        description: "Timestamp when the record entered the RAW layer."
        data_tests:
          - not_null

      - name: loaded_at
        description: "Query-time timestamp generated by the Bronze view."
        data_tests:
          - not_null

  # ============================================================
  # BRONZE RETURNS
  # Grain: One row per return_id
  # ============================================================
  - name: bronze_returns
    description: >
      Standardized return records. Return status must be considered
      when calculating completed returns and refunds.

    columns:
      - name: return_id
        description: "Unique return identifier."
        data_tests:
          - not_null
          - unique

      - name: order_item_id
        description: "Order item associated with the return."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('bronze_order_items')
                field: order_item_id

      - name: return_date
        description: "Return event timestamp recorded by the source."
        data_tests:
          - not_null

      - name: return_reason
        description: "Return reason with standardized capitalization."
        data_tests:
          - not_null

      - name: return_quantity
        description: "Quantity associated with the return record."
        data_tests:
          - not_null

      - name: refund_amount
        description: "Refund amount recorded by the source."
        data_tests:
          - not_null

      - name: return_status
        description: "Return workflow status."
        data_tests:
          - not_null

      - name: updated_at
        description: "Source record modification timestamp."

      - name: ingested_at
        description: "Timestamp when the record entered the RAW layer."
        data_tests:
          - not_null

      - name: loaded_at
        description: "Query-time timestamp generated by the Bronze view."
        data_tests:
          - not_null
