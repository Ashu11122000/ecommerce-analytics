version: 2

sources:
  - name: raw
    description: "Raw e-commerce source data loaded into PostgreSQL."

    config:
      tags: ["raw", "source"]
      freshness:
        warn_after:
          count: 24
          period: hour
        error_after:
          count: 48
          period: hour
      loaded_at_field: ingested_at

    tables:

      - name: customers
        description: "Raw customer records."
        config:
          tags: ["raw", "customer"]
        columns:
          - name: customer_id
            description: "Unique customer identifier."
          - name: customer_name
            description: "Customer full name."
          - name: email
            description: "Customer email address."
          - name: phone
            description: "Customer phone number."
          - name: gender
            description: "Customer gender."
          - name: date_of_birth
            description: "Customer date of birth."
          - name: city
            description: "Customer city."
          - name: state
            description: "Customer state."
          - name: country
            description: "Customer country."
          - name: postal_code
            description: "Customer postal code."
          - name: customer_segment
            description: "Customer segment."
          - name: customer_status
            description: "Customer status."
          - name: signup_date
            description: "Customer signup date."
          - name: updated_at
            description: "Timestamp when the record was last updated."
          - name: ingested_at
            description: "Timestamp when the record was ingested."

      - name: products
        description: "Raw product records."
        config:
          tags: ["raw", "product"]
        columns:
          - name: product_id
            description: "Unique product identifier."
          - name: product_name
            description: "Product name."
          - name: category
            description: "Product category."
          - name: subcategory
            description: "Product subcategory."
          - name: brand
            description: "Product brand."
          - name: cost_price
            description: "Product cost price."
          - name: selling_price
            description: "Product selling price."
          - name: stock_quantity
            description: "Available stock quantity."
          - name: reorder_level
            description: "Stock reorder threshold."
          - name: product_status
            description: "Product status."
          - name: launch_date
            description: "Product launch date."
          - name: updated_at
            description: "Timestamp when the record was last updated."
          - name: ingested_at
            description: "Timestamp when the record was ingested."

      - name: orders
        description: "Raw customer order records."
        config:
          tags: ["raw", "transaction", "order"]
        columns:
          - name: order_id
            description: "Unique order identifier."
          - name: customer_id
            description: "Customer who placed the order."
          - name: order_date
            description: "Order creation timestamp."
          - name: order_status
            description: "Order status."
          - name: payment_status
            description: "Payment status."
          - name: shipping_method
            description: "Shipping method."
          - name: shipping_cost
            description: "Shipping cost."
          - name: discount_amount
            description: "Discount applied to the order."
          - name: tax_amount
            description: "Tax amount."
          - name: total_amount
            description: "Total order amount."
          - name: sales_channel
            description: "Sales channel."
          - name: currency
            description: "Order currency."
          - name: updated_at
            description: "Timestamp when the record was last updated."
          - name: ingested_at
            description: "Timestamp when the record was ingested."

      - name: order_items
        description: "Raw order line-item records."
        config:
          tags: ["raw", "transaction", "order_item", "incremental"]
        columns:
          - name: order_item_id
            description: "Unique order item identifier."
          - name: order_id
            description: "Order identifier."
          - name: product_id
            description: "Product identifier."
          - name: quantity
            description: "Quantity ordered."
          - name: unit_price
            description: "Unit selling price."
          - name: discount_amount
            description: "Discount applied to the line item."
          - name: tax_amount
            description: "Tax amount for the line item."
          - name: line_total
            description: "Total value of the line item."
          - name: returned_quantity
            description: "Quantity returned."
          - name: updated_at
            description: "Timestamp when the record was last updated."
          - name: ingested_at
            description: "Timestamp when the record was ingested."

      - name: payments
        description: "Raw payment transaction records."
        config:
          tags: ["raw", "transaction", "payment"]
        columns:
          - name: payment_id
            description: "Unique payment identifier."
          - name: order_id
            description: "Order associated with the payment."
          - name: payment_date
            description: "Payment timestamp."
          - name: payment_method
            description: "Payment method."
          - name: payment_status
            description: "Payment status."
          - name: amount
            description: "Payment amount."
          - name: transaction_reference
            description: "Payment transaction reference."
          - name: updated_at
            description: "Timestamp when the record was last updated."
          - name: ingested_at
            description: "Timestamp when the record was ingested."

      - name: shipments
        description: "Raw shipment records."
        config:
          tags: ["raw", "transaction", "shipment"]
        columns:
          - name: shipment_id
            description: "Unique shipment identifier."
          - name: order_id
            description: "Order associated with the shipment."
          - name: shipping_method
            description: "Shipping method."
          - name: shipment_status
            description: "Shipment status."
          - name: shipped_at
            description: "Shipment dispatch timestamp."
          - name: delivered_at
            description: "Shipment delivery timestamp."
          - name: delivery_city
            description: "Delivery city."
          - name: delivery_state
            description: "Delivery state."
          - name: updated_at
            description: "Timestamp when the record was last updated."
          - name: ingested_at
            description: "Timestamp when the record was ingested."

      - name: returns
        description: "Raw product return records."
        config:
          tags: ["raw", "transaction", "return"]
        columns:
          - name: return_id
            description: "Unique return identifier."
          - name: order_item_id
            description: "Order item associated with the return."
          - name: return_date
            description: "Return timestamp."
          - name: return_reason
            description: "Reason for the return."
          - name: return_quantity
            description: "Quantity returned."
          - name: refund_amount
            description: "Refund amount."
          - name: return_status
            description: "Return status."
          - name: updated_at
            description: "Timestamp when the record was last updated."
          - name: ingested_at
            description: "Timestamp when the record was ingested."