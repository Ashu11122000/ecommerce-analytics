version: 2

sources:
  - name: raw
    description: "Raw OLTP-style source tables for the E-Commerce Analytics Engineering project."
    schema: raw

    config:
      freshness:
        warn_after:
          count: 24
          period: hour
        error_after:
          count: 48
          period: hour
      loaded_at_field: ingested_at

    tables:

      # ---------------------------------------------------------
      # CUSTOMERS
      # ---------------------------------------------------------
      - name: customers
        description: "Raw customer master data."

        columns:
          - name: customer_id
            description: "Unique identifier for the customer."

          - name: first_name
            description: "Customer first name."

          - name: last_name
            description: "Customer last name."

          - name: email
            description: "Customer email address."

          - name: phone
            description: "Customer phone number. May be NULL."

          - name: city
            description: "Customer city."

          - name: state
            description: "Customer state."

          - name: country
            description: "Customer country."

          - name: signup_date
            description: "Date when the customer signed up."

          - name: customer_status
            description: "Current customer status."

          - name: updated_at
            description: "Timestamp when the source record was last updated."

          - name: ingested_at
            description: "Timestamp when the record was loaded into the raw layer."


      # ---------------------------------------------------------
      # PRODUCTS
      # ---------------------------------------------------------
      - name: products
        description: "Raw product catalog data."

        columns:
          - name: product_id
            description: "Unique identifier for the product."

          - name: product_name
            description: "Product name."

          - name: category
            description: "Product category."

          - name: subcategory
            description: "Product subcategory."

          - name: brand
            description: "Product brand."

          - name: supplier_id
            description: "Identifier of the product supplier."

          - name: cost_price
            description: "Cost paid to acquire the product."

          - name: selling_price
            description: "Price at which the product is sold."

          - name: stock_quantity
            description: "Current available stock quantity."

          - name: reorder_level
            description: "Stock level at which replenishment should be considered."

          - name: product_status
            description: "Current product status."

          - name: launch_date
            description: "Date when the product was launched."

          - name: updated_at
            description: "Timestamp when the source record was last updated."

          - name: ingested_at
            description: "Timestamp when the record was loaded into the raw layer."


      # ---------------------------------------------------------
      # ORDERS
      # ---------------------------------------------------------
      - name: orders
        description: "Raw customer order transactions."

        columns:
          - name: order_id
            description: "Unique identifier for the order."

          - name: customer_id
            description: "Customer who placed the order."

          - name: order_date
            description: "Date and time when the order was placed."

          - name: order_status
            description: "Current status of the order."

          - name: payment_status
            description: "Payment status associated with the order."

          - name: shipping_status
            description: "Shipping status associated with the order."

          - name: shipping_address
            description: "Shipping address associated with the order."

          - name: subtotal
            description: "Order subtotal before discounts and taxes."

          - name: discount_amount
            description: "Total discount applied to the order."

          - name: tax_amount
            description: "Total tax charged on the order."

          - name: shipping_fee
            description: "Shipping fee charged for the order."

          - name: total_amount
            description: "Final total amount of the order."

          - name: updated_at
            description: "Timestamp when the source order was last updated."

          - name: ingested_at
            description: "Timestamp when the order was loaded into the raw layer."


      # ---------------------------------------------------------
      # ORDER ITEMS
      # ---------------------------------------------------------
      - name: order_items
        description: "Raw line-item level order transaction data."

        columns:
          - name: order_item_id
            description: "Unique identifier for the order line item."

          - name: order_id
            description: "Order associated with the line item."

          - name: product_id
            description: "Product associated with the line item."

          - name: quantity
            description: "Number of units ordered."

          - name: unit_price
            description: "Price per unit at the time of purchase."

          - name: discount_amount
            description: "Discount applied to the line item."

          - name: tax_amount
            description: "Tax applied to the line item."

          - name: line_total
            description: "Total amount for the line item."

          - name: returned_quantity
            description: "Number of units from the line item that were returned."

          - name: updated_at
            description: "Timestamp when the source line item was last updated."

          - name: ingested_at
            description: "Timestamp when the line item was loaded into the raw layer."


      # ---------------------------------------------------------
      # PAYMENTS
      # ---------------------------------------------------------
      - name: payments
        description: "Raw payment transactions associated with customer orders."

        columns:
          - name: payment_id
            description: "Unique identifier for the payment."

          - name: order_id
            description: "Order associated with the payment."

          - name: payment_date
            description: "Date and time when the payment was processed."

          - name: payment_method
            description: "Method used to make the payment."

          - name: payment_status
            description: "Current payment status."

          - name: amount
            description: "Payment amount."

          - name: transaction_reference
            description: "Reference associated with the payment transaction."

          - name: updated_at
            description: "Timestamp when the source payment record was last updated."

          - name: ingested_at
            description: "Timestamp when the payment was loaded into the raw layer."


      # ---------------------------------------------------------
      # SHIPMENTS
      # ---------------------------------------------------------
      - name: shipments
        description: "Raw shipment and delivery information associated with orders."

        columns:
          - name: shipment_id
            description: "Unique identifier for the shipment."

          - name: order_id
            description: "Order associated with the shipment."

          - name: shipment_date
            description: "Date and time when the shipment was created."

          - name: carrier
            description: "Shipping carrier."

          - name: tracking_number
            description: "Shipment tracking number."

          - name: shipment_status
            description: "Current shipment status."

          - name: estimated_delivery_date
            description: "Expected delivery date."

          - name: actual_delivery_date
            description: "Actual delivery date."

          - name: shipping_cost
            description: "Cost of shipping."

          - name: updated_at
            description: "Timestamp when the source shipment record was last updated."

          - name: ingested_at
            description: "Timestamp when the shipment was loaded into the raw layer."


      # ---------------------------------------------------------
      # RETURNS
      # ---------------------------------------------------------
      - name: returns
        description: "Raw product return transactions associated with order items."

        columns:
          - name: return_id
            description: "Unique identifier for the return."

          - name: order_item_id
            description: "Order item associated with the return."

          - name: return_date
            description: "Date when the product was returned."

          - name: return_quantity
            description: "Number of units returned."

          - name: return_reason
            description: "Reason provided for the return."

          - name: return_status
            description: "Current status of the return."

          - name: refund_amount
            description: "Amount refunded for the return."

          - name: updated_at
            description: "Timestamp when the source return record was last updated."

          - name: ingested_at
            description: "Timestamp when the return was loaded into the raw layer."