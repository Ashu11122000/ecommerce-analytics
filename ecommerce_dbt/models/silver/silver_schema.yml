version: 2

models:
  # ============================================================
  # SILVER CUSTOMERS
  # Grain: One row per customer_id
  # ============================================================
  - name: silver_customers
    description: >
      Standardized customer data with derived age, tenure,
      activity indicators, and customer status classifications.

    columns:
      - name: customer_id
        description: "Unique customer identifier."
        data_tests:
          - not_null
          - unique

      - name: customer_name
        description: "Standardized customer name."
      - name: email
        description: "Normalized customer email address."
      - name: phone
        description: "Customer phone number."
      - name: gender
        description: "Standardized customer gender."
      - name: date_of_birth
        description: "Customer date of birth."
      - name: city
        description: "Standardized customer city."
      - name: state
        description: "Standardized customer state."
      - name: country
        description: "Standardized customer country."
      - name: postal_code
        description: "Customer postal code."
      - name: customer_segment
        description: "Customer business segment."
      - name: customer_status
        description: "Standardized source customer status."
      - name: signup_date
        description: "Date when the customer signed up."

      - name: customer_age
        description: "Customer age in completed years."
      - name: age_group
        description: "Business-friendly customer age category."
      - name: customer_tenure_days
        description: "Calendar days since signup; future or missing dates produce NULL."
      - name: is_active_customer
        description: "True when customer status is active or enabled."
      - name: customer_status_group
        description: "Standardized customer status category."

      - name: updated_at
        description: "Source record update timestamp."
      - name: ingested_at
        description: "Timestamp when the record entered the raw layer."
        data_tests:
          - not_null
      - name: loaded_at
        description: "Timestamp generated by the Bronze model."
      - name: transformed_at
        description: "Timestamp generated by the Silver transformation macro."

  # ============================================================
  # SILVER PRODUCTS
  # Grain: One row per product_id
  # ============================================================
  - name: silver_products
    description: >
      Standardized product catalog with profitability calculations,
      price classifications, stock status, and product activity.

    columns:
      - name: product_id
        description: "Unique product identifier."
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: "Standardized product name."
      - name: category
        description: "Standardized product category."
      - name: subcategory
        description: "Product subcategory."
      - name: brand
        description: "Product brand."
      - name: supplier_id
        description: "Product supplier identifier."
      - name: cost_price
        description: "Recorded cost per product unit."
      - name: selling_price
        description: "Recorded selling price per unit."
      - name: stock_quantity
        description: "Recorded inventory quantity."
      - name: reorder_level
        description: "Inventory replenishment threshold."
      - name: product_status
        description: "Standardized source product status."
      - name: launch_date
        description: "Product launch date."

      - name: profit_amount
        description: "Expected profit per unit: selling price minus cost price."
      - name: profit_margin_pct
        description: "Expected unit profit divided by selling price, expressed as a percentage."
      - name: stock_status
        description: "Inventory classification based on quantity and reorder level."
      - name: price_band
        description: "Product price category based on fixed selling-price thresholds."
      - name: is_active_product
        description: "True when product status is active or available."

      - name: updated_at
        description: "Source record update timestamp."
      - name: ingested_at
        description: "Timestamp when the record entered the raw layer."
        data_tests:
          - not_null
      - name: loaded_at
        description: "Timestamp generated by the Bronze model."
      - name: transformed_at
        description: "Timestamp generated by the Silver transformation macro."

  # ============================================================
  # SILVER ORDERS
  # Grain: One row per order_id
  # ============================================================
  - name: silver_orders
    description: >
      Standardized order transactions with financial calculations,
      business status classifications, and ingestion monitoring.

    columns:
      - name: order_id
        description: "Unique order identifier."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer who placed the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_customers')
                field: customer_id

      - name: order_date
        description: "Date or timestamp when the order was placed."
        data_tests:
          - not_null

      - name: order_status
        description: "Source order status."
      - name: payment_status
        description: "Payment status recorded on the order."
      - name: shipping_method
        description: "Shipping method recorded on the order."
      - name: shipping_cost
        description: "Recorded order shipping cost."
      - name: discount_amount
        description: "Recorded order-level discount."
      - name: tax_amount
        description: "Recorded order-level tax."
      - name: total_amount
        description: "Recorded order total."
      - name: sales_channel
        description: "Channel through which the order was placed."
      - name: currency
        description: "Currency associated with the order."

      - name: amount_before_tax
        description: "Total amount minus tax, assuming total_amount includes tax."
      - name: gross_order_value
        description: "Total minus tax plus discount; validate against the source calculation."
      - name: has_discount
        description: "True when discount amount is positive; NULL when unknown."
      - name: has_shipping_cost
        description: "True when shipping cost is positive; NULL when unknown."
      - name: order_status_group
        description: "Business-friendly order status category."
      - name: is_payment_successful
        description: "True for recognized successful payment statuses."
      - name: is_late_arriving
        description: "True when ingestion occurs more than seven days after order date."
      - name: ingestion_delay_days
        description: "Calendar-day difference between ingestion date and order date."

      - name: updated_at
        description: "Source record update timestamp."
      - name: ingested_at
        description: "Timestamp when the order entered the raw layer."
        data_tests:
          - not_null
      - name: loaded_at
        description: "Timestamp generated by the Bronze model."
      - name: transformed_at
        description: "Timestamp generated by the Silver transformation macro."

  # ============================================================
  # SILVER ORDER ITEMS
  # Grain: One row per order_item_id
  # ============================================================
  - name: silver_order_items
    description: >
      Standardized order line items with calculated totals,
      data-quality flags, and return quantity indicators.

    columns:
      - name: order_item_id
        description: "Unique order item identifier."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Order containing this line item."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_orders')
                field: order_id

      - name: product_id
        description: "Purchased product identifier."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_products')
                field: product_id

      - name: quantity
        description: "Number of units purchased."
        data_tests:
          - not_null
      - name: unit_price
        description: "Historical unit price at the time of purchase."
        data_tests:
          - not_null
      - name: discount_amount
        description: "Line-item discount; Bronze defaults missing values to zero."
      - name: tax_amount
        description: "Line-item tax; Bronze defaults missing values to zero."
      - name: line_total
        description: "Line total recorded by the source."
      - name: returned_quantity
        description: "Recorded returned quantity; Bronze defaults missing values to zero."

      - name: calculated_line_total
        description: "Quantity multiplied by unit price, minus discount, plus tax."
      - name: line_total_variance
        description: "Source line total minus calculated line total."
      - name: is_line_total_mismatch
        description: "True when the absolute variance exceeds 0.01."
      - name: has_negative_quantity
        description: "True when ordered quantity is negative."
      - name: has_return
        description: "True when returned quantity is positive."
      - name: has_excess_returned_quantity
        description: "True when returned quantity exceeds ordered quantity."
      - name: return_rate
        description: "Returned quantity divided by ordered quantity when quantity is positive."

      - name: updated_at
        description: "Source record update timestamp."
      - name: ingested_at
        description: "Timestamp when the record entered the raw layer."
        data_tests:
          - not_null
      - name: loaded_at
        description: "Timestamp generated by the Bronze model."
      - name: transformed_at
        description: "Timestamp generated by the Silver transformation macro."

  # ============================================================
  # SILVER PAYMENTS
  # Grain: One row per payment_id
  # ============================================================
  - name: silver_payments
    description: >
      Standardized payment transactions with status groups,
      payment amount bands, and transaction reference indicators.

    columns:
      - name: payment_id
        description: "Unique payment identifier."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Order associated with the payment."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_orders')
                field: order_id

      - name: payment_date
        description: "Date or timestamp when the payment was recorded."
        data_tests:
          - not_null
      - name: payment_method
        description: "Payment method used."
      - name: payment_status
        description: "Source payment status."
      - name: amount
        description: "Recorded payment amount."
        data_tests:
          - not_null
      - name: transaction_reference
        description: "Payment transaction reference."

      - name: payment_status_group
        description: "Successful, Failed, Pending, Refunded, Unknown, or Other."
      - name: is_successful_payment
        description: "True for recognized successful payment statuses."
      - name: payment_amount_band
        description: "Fixed payment amount category; negative amounts are Invalid."
      - name: has_transaction_reference
        description: "True when a non-empty transaction reference is present."
      - name: payment_update_delay_days
        description: "Calendar-day difference between payment date and source update date."

      - name: updated_at
        description: "Source record update timestamp."
      - name: ingested_at
        description: "Timestamp when the record entered the raw layer."
        data_tests:
          - not_null
      - name: loaded_at
        description: "Timestamp generated by the Bronze model."
      - name: transformed_at
        description: "Timestamp generated by the Silver transformation macro."

  # ============================================================
  # SILVER SHIPMENTS
  # Grain: One row per shipment_id
  # ============================================================
  - name: silver_shipments
    description: >
      Standardized shipment data with delivery duration,
      shipment status groups, delivery speed, and delay flags.

    columns:
      - name: shipment_id
        description: "Unique shipment identifier."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Order associated with the shipment."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_orders')
                field: order_id

      - name: shipping_method
        description: "Shipping method used."
        data_tests:
          - not_null
      - name: shipment_status
        description: "Source shipment status."
        data_tests:
          - not_null
      - name: shipped_at
        description: "Shipment dispatch timestamp."
      - name: delivered_at
        description: "Shipment delivery timestamp."
      - name: delivery_city
        description: "Destination city."
      - name: delivery_state
        description: "Destination state."

      - name: delivery_days
        description: "Elapsed delivery duration in days, rounded to two decimal places."
      - name: is_delivered
        description: "True when delivered_at is present."
      - name: shipment_status_group
        description: "Business-friendly shipment status category."
      - name: delivery_speed
        description: "Fast up to two days, Standard up to five days, Slow above five days, or Unknown/Invalid."
      - name: is_delivery_delayed
        description: "True when delivery exceeds five days; NULL for missing or reversed timestamps."

      - name: updated_at
        description: "Source record update timestamp."
      - name: ingested_at
        description: "Timestamp when the record entered the raw layer."
        data_tests:
          - not_null
      - name: loaded_at
        description: "Timestamp generated by the Bronze model."
      - name: transformed_at
        description: "Timestamp generated by the Silver transformation macro."

  # ============================================================
  # SILVER RETURNS
  # Grain: One row per return_id
  # ============================================================
  - name: silver_returns
    description: >
      Standardized return records with status groups, refund metrics,
      return quantity validation, and source update monitoring.

    columns:
      - name: return_id
        description: "Unique return identifier."
        data_tests:
          - not_null
          - unique

      - name: order_item_id
        description: "Order item associated with the return."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_order_items')
                field: order_item_id

      - name: return_date
        description: "Date or timestamp when the return was recorded."
        data_tests:
          - not_null
      - name: return_reason
        description: "Recorded return reason."
      - name: return_quantity
        description: "Number of units recorded in the return."
        data_tests:
          - not_null
      - name: refund_amount
        description: "Refund amount recorded for the return."
        data_tests:
          - not_null
      - name: return_status
        description: "Source return status."
        data_tests:
          - not_null

      - name: return_status_group
        description: "Approved, Pending, Rejected, Unknown, or Other."
      - name: is_return_approved
        description: "True for approved, completed, or processed statuses; does not confirm refund payment."
      - name: refund_per_unit
        description: "Refund amount divided by return quantity when quantity is positive."
      - name: has_refund
        description: "True when refund amount is positive."
      - name: has_invalid_return_quantity
        description: "True when return quantity is zero or negative."
      - name: return_update_delay_days
        description: "Calendar-day difference between return date and source update date."

      - name: updated_at
        description: "Source record update timestamp."
      - name: ingested_at
        description: "Timestamp when the record entered the raw layer."
        data_tests:
          - not_null
      - name: loaded_at
        description: "Timestamp generated by the Bronze model."
      - name: transformed_at
        description: "Timestamp generated by the Silver transformation macro."
