version: 2

models:
  # ============================================================
  # SILVER CUSTOMERS
  # Grain: One row per customer_id
  # ============================================================
  - name: silver_customers
    description: >
      Standardized customer data enriched with derived age,
      age group, tenure, activity indicators, and customer
      status classifications. One row per customer_id.

    columns:
      - name: customer_id
        description: "Unique customer identifier; defines the model grain."
        data_tests:
          - not_null
          - unique

      - name: customer_name
        description: "Standardized customer name with surrounding whitespace trimmed."

      - name: email
        description: "Customer email address normalized to lowercase."

      - name: phone
        description: "Customer phone number; blank values are represented as NULL."

      - name: gender
        description: "Customer gender with standardized capitalization."

      - name: date_of_birth
        description: "Customer date of birth from the source."

      - name: city
        description: "Customer city with standardized capitalization."

      - name: state
        description: "Customer state with standardized capitalization."

      - name: country
        description: "Customer country with standardized capitalization."

      - name: postal_code
        description: "Customer postal code with surrounding whitespace trimmed."

      - name: customer_segment
        description: "Customer business segment from the source."

      - name: customer_status
        description: "Source customer status with standardized capitalization."

      - name: signup_date
        description: "Date when the customer signed up."

      - name: customer_age
        description: >
          Customer age in completed years relative to the current date.
          NULL when the birth date is missing or in the future.

      - name: age_group
        description: >
          Customer age category: Under 18, 18-24, 25-34, 35-44,
          45-54, 55-64, 65+, or Unknown.

      - name: customer_tenure_days
        description: >
          Calendar days since signup. NULL when the signup date
          is missing or in the future.

      - name: is_active_customer
        description: >
          TRUE when customer status is active or enabled.
          FALSE for other recognized or unrecognized non-null statuses;
          NULL status currently evaluates to FALSE.

      - name: customer_status_group
        description: >
          Standardized customer status category: Active, Inactive,
          Restricted, or Unknown.

      - name: updated_at
        description: "Source record update timestamp."

      - name: ingested_at
        description: "Timestamp when the record entered the RAW layer."
        data_tests:
          - not_null

      - name: loaded_at
        description: >
          Query-time timestamp generated by the Bronze view.
          It is not a persisted historical ingestion timestamp.

      - name: transformed_at
        description: >
          Transformation timestamp generated by the transformed_timestamp
          macro. Its behavior depends on the macro implementation.

  # ============================================================
  # SILVER PRODUCTS
  # Grain: One row per product_id
  # ============================================================
  - name: silver_products
    description: >
      Standardized product catalog enriched with expected unit
      profitability, profit margin, price bands, stock classifications,
      and product activity indicators. One row per product_id.

    columns:
      - name: product_id
        description: "Unique product identifier; defines the model grain."
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: "Standardized product name."

      - name: category
        description: "Product category with standardized capitalization."

      - name: subcategory
        description: "Product subcategory with standardized capitalization."

      - name: brand
        description: "Product brand with standardized capitalization."

      - name: supplier_id
        description: "Supplier identifier recorded in the source."

      - name: cost_price
        description: "Recorded product cost price per unit."

      - name: selling_price
        description: "Recorded product selling price per unit."

      - name: stock_quantity
        description: "Recorded inventory quantity."

      - name: reorder_level
        description: "Inventory replenishment threshold."

      - name: product_status
        description: "Source product status with standardized capitalization."

      - name: launch_date
        description: "Product launch date recorded in the source."

      - name: profit_amount
        description: >
          Expected profit per unit, calculated as selling price minus
          cost price. This is not total realized sales profit.

      - name: profit_margin_pct
        description: >
          Expected unit profit divided by selling price, expressed
          as a percentage. NULL when selling price is not positive
          or cost price is missing.

      - name: stock_status
        description: >
          Inventory classification based on stock quantity and reorder
          level: Unknown, Invalid Stock, Out of Stock, Low Stock, or In Stock.

      - name: price_band
        description: >
          Product price category based on fixed selling-price thresholds:
          Budget, Mid-Range, Premium, Luxury, Unknown, or Invalid Price.

      - name: is_active_product
        description: >
          TRUE when product status is active or available.
          FALSE for other non-null statuses; NULL when status is missing.

      - name: updated_at
        description: "Source record update timestamp."

      - name: ingested_at
        description: "Timestamp when the record entered the RAW layer."
        data_tests:
          - not_null

      - name: loaded_at
        description: >
          Query-time timestamp generated by the Bronze view.
          It is not a persisted historical ingestion timestamp.

      - name: transformed_at
        description: >
          Transformation timestamp generated by the transformed_timestamp
          macro. Its behavior depends on the macro implementation.

  # ============================================================
  # SILVER ORDERS
  # Grain: One row per order_id
  # ============================================================
  - name: silver_orders
    description: >
      Standardized order records enriched with financial calculations,
      business-friendly order status groups, payment indicators,
      and late-arriving data monitoring. One row per order_id.

    columns:
      - name: order_id
        description: "Unique order identifier; defines the model grain."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer who placed the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_customers')
                field: customer_id

      - name: order_date
        description: "Date or timestamp when the order was placed."
        data_tests:
          - not_null

      - name: order_status
        description: "Source order status with standardized capitalization."

      - name: payment_status
        description: "Payment status recorded on the order."

      - name: shipping_method
        description: "Shipping method recorded on the order."

      - name: shipping_cost
        description: "Recorded order shipping cost; Bronze defaults NULL to zero."

      - name: discount_amount
        description: "Recorded order-level discount; Bronze defaults NULL to zero."

      - name: tax_amount
        description: "Recorded order-level tax; Bronze defaults NULL to zero."

      - name: total_amount
        description: >
          Order total recorded by the source. Its financial composition
          must be confirmed before deriving reporting metrics.

      - name: sales_channel
        description: "Channel through which the order was placed."

      - name: currency
        description: "Currency associated with the order, normalized to uppercase."

      - name: amount_before_tax
        description: >
          Calculated as total_amount minus tax_amount, assuming
          total_amount includes tax.

      - name: gross_order_value
        description: >
          Calculated as total_amount minus tax_amount plus discount_amount.
          Validate this formula against the source data generation logic.

      - name: has_discount
        description: >
          TRUE when discount amount is positive, FALSE when it is
          zero or negative, and NULL when the amount is unknown.

      - name: has_shipping_cost
        description: >
          TRUE when shipping cost is positive, FALSE when it is
          zero or negative, and NULL when the amount is unknown.

      - name: order_status_group
        description: >
          Business-friendly order status category: Completed, In Progress,
          Pending, Cancelled, Returned, Unknown, or Other.

      - name: is_payment_successful
        description: >
          TRUE for recognized successful payment statuses, FALSE for
          other non-null statuses, and NULL for missing payment status.
          This reflects the order's recorded payment status, not a
          reconciliation against individual payment transactions.

      - name: is_late_arriving
        description: >
          TRUE when ingestion occurs more than seven elapsed days
          after order_date. NULL when either timestamp is missing.

      - name: ingestion_delay_days
        description: >
          Calendar-day difference between ingestion date and order date.
          May be negative if ingestion precedes the order date.

      - name: updated_at
        description: "Source record update timestamp."

      - name: ingested_at
        description: "Timestamp when the order entered the RAW layer."
        data_tests:
          - not_null

      - name: loaded_at
        description: >
          Query-time timestamp generated by the Bronze view.
          It is not a persisted historical ingestion timestamp.

      - name: transformed_at
        description: >
          Transformation timestamp generated by the transformed_timestamp
          macro. Its behavior depends on the macro implementation.

  # ============================================================
  # SILVER ORDER ITEMS
  # Grain: One row per order_item_id
  # ============================================================
  - name: silver_order_items
    description: >
      Standardized order line items enriched with calculated totals,
      financial variance checks, quantity anomaly flags, and return
      indicators. One row per order_item_id.

    columns:
      - name: order_item_id
        description: "Unique order item identifier; defines the model grain."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Order containing this line item."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_orders')
                field: order_id

      - name: product_id
        description: "Product associated with this order item."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_products')
                field: product_id

      - name: quantity
        description: >
          Number of units recorded for the order item.
          Invalid values are preserved for downstream investigation.
        data_tests:
          - not_null

      - name: unit_price
        description: "Historical unit price recorded at purchase."
        data_tests:
          - not_null

      - name: discount_amount
        description: "Line-item discount; Bronze defaults NULL to zero."

      - name: tax_amount
        description: "Line-item tax; Bronze defaults NULL to zero."

      - name: line_total
        description: "Line total recorded by the source."

      - name: returned_quantity
        description: "Recorded returned quantity; Bronze defaults NULL to zero."

      - name: calculated_line_total
        description: >
          Calculated as quantity multiplied by unit price,
          minus discount amount, plus tax amount. Validate
          this formula against the source calculation.

      - name: line_total_variance
        description: >
          Recorded source line total minus calculated line total,
          rounded to two decimal places.

      - name: is_line_total_mismatch
        description: >
          TRUE when the absolute difference between recorded and
          calculated totals exceeds 0.01; NULL when comparison is
          not possible.

      - name: has_negative_quantity
        description: "TRUE when ordered quantity is negative; NULL when quantity is missing."

      - name: has_return
        description: >
          TRUE when returned quantity is positive. This does not
          establish that a return workflow has been completed.

      - name: has_excess_returned_quantity
        description: >
          TRUE when returned quantity exceeds ordered quantity;
          NULL when either quantity is missing.

      - name: return_rate
        description: >
          Returned quantity divided by ordered quantity when
          ordered quantity is positive and returned quantity is known.
          This is a quantity-based ratio and may exceed 1.0.

      - name: updated_at
        description: "Source record update timestamp."

      - name: ingested_at
        description: "Timestamp when the order item entered the RAW layer."
        data_tests:
          - not_null

      - name: loaded_at
        description: >
          Query-time timestamp generated by the Bronze view.
          It is not a persisted historical ingestion timestamp.

      - name: transformed_at
        description: >
          Transformation timestamp generated by the transformed_timestamp
          macro. Its behavior depends on the macro implementation.

  # ============================================================
  # SILVER PAYMENTS
  # Grain: One row per payment_id
  # ============================================================
  - name: silver_payments
    description: >
      Standardized payment transactions enriched with status groups,
      payment amount bands, transaction-reference indicators, and
      update-delay monitoring. One row per payment_id.

    columns:
      - name: payment_id
        description: "Unique payment identifier; defines the model grain."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Order associated with the payment."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_orders')
                field: order_id

      - name: payment_date
        description: "Date or timestamp when the payment was recorded."
        data_tests:
          - not_null

      - name: payment_method
        description: "Payment method recorded by the source."

      - name: payment_status
        description: "Source payment status."

      - name: amount
        description: >
          Payment amount recorded by the source. Preserve its original
          value for financial reconciliation.
        data_tests:
          - not_null

      - name: transaction_reference
        description: "Payment transaction reference; blank values become NULL."

      - name: payment_status_group
        description: >
          Standardized payment category: Successful, Failed, Pending,
          Refunded, Unknown, or Other.

      - name: is_successful_payment
        description: >
          TRUE for recognized successful payment statuses, FALSE for
          other non-null statuses, and NULL when payment status is missing.

      - name: payment_amount_band
        description: >
          Fixed amount category: Small, Medium, Large, Very Large,
          Unknown, or Invalid. Thresholds use the numeric amount
          in its recorded currency.

      - name: has_transaction_reference
        description: "TRUE when a non-empty transaction reference is present."

      - name: payment_update_delay_days
        description: >
          Calendar-day difference between payment date and source
          update date. Negative values are retained for investigation.

      - name: updated_at
        description: "Source record update timestamp."

      - name: ingested_at
        description: "Timestamp when the payment entered the RAW layer."
        data_tests:
          - not_null

      - name: loaded_at
        description: >
          Query-time timestamp generated by the Bronze view.
          It is not a persisted historical ingestion timestamp.

      - name: transformed_at
        description: >
          Transformation timestamp generated by the transformed_timestamp
          macro. Its behavior depends on the macro implementation.

  # ============================================================
  # SILVER SHIPMENTS
  # Grain: One row per shipment_id
  # ============================================================
  - name: silver_shipments
    description: >
      Standardized shipment data enriched with delivery duration,
      shipment status groups, delivery speed classifications,
      and delivery delay flags. One row per shipment_id.

    columns:
      - name: shipment_id
        description: "Unique shipment identifier; defines the model grain."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Order associated with the shipment."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_orders')
                field: order_id

      - name: shipping_method
        description: "Shipping method recorded by the source."
        data_tests:
          - not_null

      - name: shipment_status
        description: "Source shipment status."
        data_tests:
          - not_null

      - name: shipped_at
        description: "Shipment dispatch timestamp."

      - name: delivered_at
        description: "Shipment delivery timestamp."

      - name: delivery_city
        description: "Destination city with standardized capitalization."

      - name: delivery_state
        description: "Destination state with standardized capitalization."

      - name: delivery_days
        description: >
          Elapsed duration between shipment and delivery in days,
          rounded to two decimal places. Negative values can indicate
          invalid timestamp ordering.

      - name: is_delivered
        description: "TRUE when delivered_at is present; otherwise FALSE."

      - name: shipment_status_group
        description: >
          Business-friendly shipment category: Delivered, In Transit,
          Pending, Cancelled, Unknown, or Other.

      - name: delivery_speed
        description: >
          Fast for valid durations up to two days, Standard for durations
          above two and up to five days, Slow for durations above five
          days, Unknown when timestamps are missing, or Invalid when
          delivery precedes shipment.

      - name: is_delivery_delayed
        description: >
          TRUE when a valid delivery duration exceeds five days,
          FALSE when it does not, and NULL when timestamps are missing
          or reversed.

      - name: updated_at
        description: "Source record update timestamp."

      - name: ingested_at
        description: "Timestamp when the shipment entered the RAW layer."
        data_tests:
          - not_null

      - name: loaded_at
        description: >
          Query-time timestamp generated by the Bronze view.
          It is not a persisted historical ingestion timestamp.

      - name: transformed_at
        description: >
          Transformation timestamp generated by the transformed_timestamp
          macro. Its behavior depends on the macro implementation.

  # ============================================================
  # SILVER RETURNS
  # Grain: One row per return_id
  # ============================================================
  - name: silver_returns
    description: >
      Standardized return records enriched with return status groups,
      refund metrics, quantity validation, and source update monitoring.
      One row per return_id.

    columns:
      - name: return_id
        description: "Unique return identifier; defines the model grain."
        data_tests:
          - not_null
          - unique

      - name: order_item_id
        description: "Order item associated with the return."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_order_items')
                field: order_item_id

      - name: return_date
        description: "Date or timestamp when the return was recorded."
        data_tests:
          - not_null

      - name: return_reason
        description: "Return reason recorded by the source."

      - name: return_quantity
        description: "Quantity associated with the return record."
        data_tests:
          - not_null

      - name: refund_amount
        description: "Refund amount recorded by the source."
        data_tests:
          - not_null

      - name: return_status
        description: "Source return status."
        data_tests:
          - not_null

      - name: return_status_group
        description: >
          Standardized return category: Approved, Pending, Rejected,
          Unknown, or Other.

      - name: is_return_approved
        description: >
          TRUE for approved, completed, or processed statuses; FALSE
          for other non-null statuses; NULL when status is missing.
          Does not confirm that a refund was paid.

      - name: refund_per_unit
        description: >
          Refund amount divided by return quantity when quantity
          is positive and refund amount is known.

      - name: has_refund
        description: >
          TRUE when the recorded refund amount is positive, FALSE
          when it is zero or negative, and NULL when unknown.

      - name: has_invalid_return_quantity
        description: >
          TRUE when return quantity is zero or negative, FALSE
          when positive, and NULL when quantity is missing.

      - name: return_update_delay_days
        description: >
          Calendar-day difference between return date and source
          update date. Negative values are retained for investigation.

      - name: updated_at
        description: "Source record update timestamp."

      - name: ingested_at
        description: "Timestamp when the return entered the RAW layer."
        data_tests:
          - not_null

      - name: loaded_at
        description: >
          Query-time timestamp generated by the Bronze view.
          It is not a persisted historical ingestion timestamp.

      - name: transformed_at
        description: >
          Transformation timestamp generated by the transformed_timestamp
          macro. Its behavior depends on the macro implementation.
